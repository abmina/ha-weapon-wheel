name: Weapon Wheel Dashboard
version: "0.3.4"
slug: weapon_wheel
description: Game-style dashboard - a house map with clickable rooms that open weapon-wheel menus for your devices and entities
url: https://github.com/abmina/ha-weapon-wheel
arch:
  - aarch64
  - amd64
init: false
ingress: true
panel_icon: mdi:target
panel_title: Weapon Wheel
# Visible to non-admin users too (e.g. a wall panel). Only administrators can edit the dashboard.
panel_admin: false
# homeassistant_api lets the app read floors, areas, devices and entities and
# call services through the Supervisor's Home Assistant proxy.
homeassistant_api: true
options:
  show_hidden_entities: false
schema:
  # No longer used: diagnostic entities are always listed in the device sidebar.
  show_diagnostic_entities: bool?
  show_hidden_entities: bool
  accent_color: match(^#[0-9a-fA-F]{6}$)?
