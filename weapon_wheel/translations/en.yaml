configuration:
  show_diagnostic_entities:
    name: Show diagnostic and config entities
    description: Include entities such as signal strength, battery level and firmware that Home Assistant marks as diagnostic or configuration.
  show_hidden_entities:
    name: Show hidden entities
    description: Include entities that are hidden in Home Assistant.
  accent_color:
    name: Highlight colour (optional)
    description: Hex colour that replaces the theme's blue for highlights, e.g. "#2e9d57". Leave empty for the standard theme.
