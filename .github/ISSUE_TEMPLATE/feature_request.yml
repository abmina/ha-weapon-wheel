name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like the app to do?
      description: Describe the problem you're trying to solve, not only the solution.
    validations:
      required: true
  - type: input
    id: domain
    attributes:
      label: Device or entity type (if relevant)
      placeholder: "climate, media_player, a Zigbee blind…"
