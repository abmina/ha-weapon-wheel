name: Bug report
description: Something in the app doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! The details below let us reproduce the problem without guessing.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: addon_version
    attributes:
      label: App version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      placeholder: "2026.11.0"
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser / device
      description: Where you opened the dashboard
      placeholder: "Chrome 142 on Windows, Home Assistant Companion app on iPhone…"
  - type: textarea
    id: entity
    attributes:
      label: Entity involved (if any)
      description: "For a control that doesn't work: the entity ID and its attributes (sidebar → Attributes)."
      render: text
  - type: textarea
    id: log
    attributes:
      label: App log
      description: "Settings → Apps → Weapon Wheel Dashboard → Log"
      render: text
  - type: textarea
    id: console
    attributes:
      label: Browser console errors (optional)
      description: Press F12 → Console and paste any red errors.
      render: text
